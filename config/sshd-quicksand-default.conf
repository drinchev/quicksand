# Managed by quicksand — installed by every sandbox build; edits are
# overwritten. Removed when the last sandbox is uninstalled.
#
# No SSH login for sandbox users unless `qs ssh-auth NAME` set one up.
# A sandbox user is an ordinary macOS account whose home the sandbox can
# write, so without this rule an agent could add a key to its own
# ~/.ssh/authorized_keys and ssh to localhost, landing in a plain shell
# outside sandbox-exec.
#
# Sandboxes with SSH enabled have their own 010-quicksand-qs-NAME.conf, which
# sorts before this file: sshd keeps the first value it sees for each
# keyword, so their key file wins and everything here still backs them up.
Match User qs-*
    AuthorizedKeysFile none
    AuthorizedKeysCommand none
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitUserRC no
