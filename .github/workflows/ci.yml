name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # qs is macOS-only (dscl, sandbox-exec, BSD stat); the tests stub the
    # privileged parts but still need the BSD userland.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install shellcheck bats-core

      - name: Lint
        run: shellcheck qs.bash app/scripts/bundle.sh app/scripts/install.sh libexec/* profile.d/*.sh config/qs-docker-broker config/qs-docker config/qs-ssh-session config/qs-auth-broker logout.d/*.sh

      - name: Test
        run: bats tests

      - name: Test Quicksand.app
        run: swift test --package-path app
